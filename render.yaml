databases:
  - name: mobile-flutter-db
    plan: free
    databaseName: mobile_flutter
    user: mobile_flutter_user

services:
  - type: web
    name: mobile-flutter-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    autoDeploy: true
    plan: free
    healthCheckPath: /
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: PORT
        value: "8080"
      - key: Jwt__Issuer
        value: FridgeAssistant
      - key: Jwt__Audience
        value: FridgeAssistantUsers
      - key: Cors__AllowedOrigins__0
        value: https://mobile-flutter.app
      - key: Cors__AllowedOrigins__1
        value: https://mobile-flutter-backend.onrender.com
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: mobile-flutter-db
          property: connectionString
      - key: Jwt__Key
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: Gemini__ApiKey
        sync: false
      - key: Brevo__ApiKey
        sync: false
      - key: Smtp__Host
        value: smtp-relay.brevo.com
      - key: Smtp__Port
        value: "587"
      - key: Smtp__Username
        sync: false
      - key: Smtp__Password
        sync: false
      - key: Smtp__FromEmail
        sync: false
      - key: Smtp__FromName
        value: Fridge Manager
      - key: Smtp__SecureSocketOptions
        value: StartTls
      - key: Smtp__RequireAuthentication
        value: "true"